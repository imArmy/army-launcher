name: Build ARMY Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install minecraft-launcher-lib pyinstaller

      - name: Собрать exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name ARMY_Launcher army_launcher.py

      - name: Загрузить готовый exe
        uses: actions/upload-artifact@v4
        with:
          name: ARMY_Launcher
          path: dist/ARMY_Launcher.exe
